[project]
name = "moxskr-sf-template"
version = "0.1.0"
description = "Salesforce DX template scripts and Python tooling"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"ruff",
	"ty",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.14"
